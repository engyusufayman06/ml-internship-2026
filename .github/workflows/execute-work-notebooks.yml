name: Execute Work Notebooks

on:
  push:
    branches: [main]
    paths:
      - 'work/notebooks/w01_research_question.ipynb'
      - 'work/notebooks/w04_baseline_score.ipynb'
      - 'work/notebooks/w03_feature_leakage_check.ipynb'
      - 'work/notebooks/w04_signal_audit.ipynb'
      - 'work/notebooks/w05_model.ipynb'
      - 'work/notebooks/w06_validation_audit.ipynb'
      - 'work/notebooks/w07_action_playbook.ipynb'
      - 'work/notebooks/capstone.ipynb'
      - '.github/workflows/execute-work-notebooks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt jupyter nbconvert nbformat

      - name: Execute local-data notebooks
        run: |
          set -e
          for nb in \
            work/notebooks/w01_research_question.ipynb \
            work/notebooks/w03_feature_leakage_check.ipynb \
            work/notebooks/w04_signal_audit.ipynb \
            work/notebooks/w04_baseline_score.ipynb \
            work/notebooks/w05_model.ipynb \
            work/notebooks/w06_validation_audit.ipynb \
            work/notebooks/w07_action_playbook.ipynb \
            work/notebooks/capstone.ipynb
          do
            echo "=== Executing $nb ==="
            jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1200 "$nb"
          done

      - name: Commit executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/notebooks/*.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "chore: execute work notebooks [skip ci]"
            git push
          fi
